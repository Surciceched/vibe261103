<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Python 프로젝트 썸네일 자리표시자">
  <defs>
    <linearGradient id="bgp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132033"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bgp)"/>
  <g font-family="ui-monospace, monospace" font-size="17" fill="#58a6ff">
    <text x="48" y="118">def collect(urls):</text>
    <text x="78" y="150" fill="#a9b6c6">rows = [fetch(u) for u in urls]</text>
    <text x="78" y="182" fill="#a9b6c6">return normalize(rows)</text>
  </g>
  <rect x="48" y="216" width="200" height="8" rx="4" fill="#58a6ff" opacity=".5"/>
  <rect x="48" y="236" width="320" height="8" rx="4" fill="#58a6ff" opacity=".28"/>
  <text x="592" y="316" fill="#8b99aa" font-family="ui-monospace, monospace" font-size="14" text-anchor="end">PYTHON</text>
</svg>
